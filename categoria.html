<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0A100A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Categoría | Anuncios con Estilos</title>
<link rel="icon" href="imagenes/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=Rye&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
  <link href="css/fusion.css" rel="stylesheet">
</head>
<body>

<div id="navbar-slot"></div>

<header class="cat-hero" id="catHero">
  <div class="content">
    <div class="icon-badge" id="catIconBadge"><i class="bi bi-shop"></i></div>
    <h1 id="catTitle">Categoría</h1>
    <p id="catSubtitle" class="mb-0">Descubre las mejores empresas de la región</p>
  </div>
</header>

<div class="container">
  <div class="search-panel">
    <form class="row g-2 align-items-center" id="filtroForm">
      <div class="col-md-5">
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="bi bi-search text-primary-brand"></i></span>
          <input type="text" id="qInput" class="form-control" placeholder="Buscar empresa, tipo de servicio...">
        </div>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="ubicacionSelect">
          <option value="">Ubicación</option>
          <option value="Tame">Tame, Arauca</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="subcatSelect">
          <option value="">Tipo</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-buscar w-100" type="submit">Buscar</button>
      </div>
    </form>
  </div>
</div>

<section class="container py-5">
  <div class="section-eyebrow"><i class="bi bi-tags"></i> Explora por tipo</div>
  <div class="d-flex flex-wrap gap-2" id="subcatPills"></div>
</section>

<section class="container py-3">
  <div class="row g-4">
    <div class="col-lg-8">
      <div class="section-eyebrow"><span id="listTitle">Empresas</span></div>
      <div id="listado"></div>
      <div id="sinResultados" class="text-center text-muted py-5 d-none">
        <i class="bi bi-emoji-frown fs-1 d-block mb-2"></i>
        No encontramos empresas con esos filtros. Intenta con otra búsqueda.
      </div>
    </div>
    <div class="col-lg-4">
      <div class="section-eyebrow"><span>Mapa</span></div>
      <div class="map-container mb-3" style="height:320px;"><div id="map-cat" style="height:320px;"></div></div>
      <div class="bg-white p-3 rounded-16 shadow-soft text-center">
        <i class="bi bi-search fs-3 text-primary-brand"></i>
        <p class="mb-2 mt-2 fw-semibold">¿Buscas algo específico?</p>
        <p class="text-muted small">Usa nuestro buscador para encontrar exactamente lo que necesitas por tipo de servicio o ubicación.</p>
        <a href="buscar.html" class="btn btn-buscar w-100">Buscador avanzado</a>
      </div>
    </div>
  </div>
</section>

<div id="footer-slot"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="api/empresas.php"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
initHeaderFooter("categorias");

const slug = qs("cat") || "restaurantes";
const cat = catInfo(slug);
let empresas = DB.byCategoria(slug);

document.title = cat.nombre + " | Anuncios con Estilos";
document.getElementById("catTitle").textContent = cat.nombre;
document.getElementById("catIconBadge").innerHTML = `<i class="bi ${cat.icono}"></i>`;
document.getElementById("catHero").style.backgroundImage = `linear-gradient(0deg, rgba(75,29,128,.15), rgba(75,29,128,.15)), url('${(empresas[0] && empresas[0].imagenes[0]) || "imagenes/fotos/parque-central-tame.jpg"}')`;
document.getElementById("catSubtitle").textContent = `Descubre las mejores empresas de ${cat.nombre.toLowerCase()} de la región`;
document.getElementById("listTitle").textContent = "Empresas de " + cat.nombre.toLowerCase();

const subcats = [...new Set(empresas.map(e=>e.subcategoria).filter(Boolean))];
document.getElementById("subcatSelect").innerHTML += subcats.map(s=>`<option value="${s}">${s}</option>`).join("");
document.getElementById("subcatPills").innerHTML = subcats.map(s=>`<button class="badge-cat" data-sub="${s}" onclick="filtrarSub('${s}')">${s}</button>`).join("");

function pintarListado(lista) {
  const cont = document.getElementById("listado");
  const vacio = document.getElementById("sinResultados");
  if (!lista.length) { cont.innerHTML=""; vacio.classList.remove("d-none"); return; }
  vacio.classList.add("d-none");
  cont.innerHTML = lista.map(empresaRowHtml).join("");
}
pintarListado(empresas);

let mapCat;
function pintarMapa(lista) {
  if (mapCat) { mapCat.remove(); }
  mapCat = L.map('map-cat').setView([6.4635, -71.7330], 14);
  crearCapaMapa().addTo(mapCat);
  lista.forEach(e => {
    L.marker([e.lat, e.lng], { icon: iconoMarcador(cat, 28) }).addTo(mapCat).bindPopup(popupEmpresa(e));
  });
  if (lista.length) mapCat.fitBounds(lista.map(e => [e.lat, e.lng]), { padding: [30, 30], maxZoom: 16 });
}
pintarMapa(empresas);

function filtrarSub(s) {
  document.getElementById("subcatSelect").value = s;
  aplicarFiltros();
}

function aplicarFiltros() {
  const q = document.getElementById("qInput").value.toLowerCase();
  const sub = document.getElementById("subcatSelect").value;
  const filtradas = empresas.filter(e => {
    const matchQ = !q || e.nombre.toLowerCase().includes(q) || (e.descripcion||"").toLowerCase().includes(q) || (e.servicios||[]).join(" ").toLowerCase().includes(q);
    const matchSub = !sub || e.subcategoria === sub;
    return matchQ && matchSub;
  });
  pintarListado(filtradas);
  pintarMapa(filtradas);
  document.querySelectorAll("#subcatPills .badge-cat").forEach(b=>b.classList.toggle("active", b.dataset.sub===sub));
}

document.getElementById("filtroForm").addEventListener("submit", e=>{ e.preventDefault(); aplicarFiltros(); });
document.getElementById("subcatSelect").addEventListener("change", aplicarFiltros);
document.getElementById("qInput").addEventListener("input", aplicarFiltros);
</script>
  <script src="js/fusion.js"></script>
</body>
</html>
