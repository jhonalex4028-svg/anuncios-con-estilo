<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0A100A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscar empresas | Anuncios con Estilos</title>
<link rel="icon" href="imagenes/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=Rye&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
  <link href="css/fusion.css" rel="stylesheet">
</head>
<body>
<div id="navbar-slot"></div>

<header class="cat-hero" style="height:180px;background-image:url('imagenes/fotos/porton-bienvenida-tame.jpg')">
  <div class="content">
    <div class="icon-badge"><i class="bi bi-search"></i></div>
    <h1>Buscador de empresas</h1>
    <p class="mb-0">Encuentra exactamente lo que necesitas por nombre, categoría o servicio</p>
  </div>
</header>

<div class="container">
  <div class="search-panel">
    <form class="row g-2 align-items-center" id="filtroForm">
      <div class="col-md-5">
        <div class="input-group">
          <span class="input-group-text bg-white border-0"><i class="bi bi-search text-primary-brand"></i></span>
          <input type="text" id="qInput" class="form-control" placeholder="Nombre, servicio o palabra clave...">
        </div>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="catSelect">
          <option value="">Todas las categorías</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="ordenSelect">
          <option value="relevancia">Relevancia</option>
          <option value="calificacion">Mejor calificadas</option>
          <option value="nombre">Nombre A-Z</option>
        </select>
      </div>
      <div class="col-md-2">
        <button class="btn btn-buscar w-100" type="submit">Buscar</button>
      </div>
    </form>
  </div>
</div>

<section class="container py-5">
  <p class="text-muted mb-4"><span id="resultCount">0</span> empresas encontradas</p>
  <div class="row g-4" id="resultados"></div>
  <div id="sinResultados" class="text-center text-muted py-5 d-none">
    <i class="bi bi-emoji-frown fs-1 d-block mb-2"></i>
    No encontramos empresas con esos filtros. Intenta con otra búsqueda.
  </div>
</section>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="api/empresas.php"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
initHeaderFooter("empresas");

document.getElementById("catSelect").innerHTML += CATEGORIAS.map(c=>`<option value="${c.slug}">${c.nombre}</option>`).join("");

const qInicial = qs("q") || "";
document.getElementById("qInput").value = qInicial;

function buscar() {
  const q = document.getElementById("qInput").value.toLowerCase();
  const cat = document.getElementById("catSelect").value;
  const orden = document.getElementById("ordenSelect").value;

  let lista = DB.all().filter(e => {
    const matchQ = !q ||
      e.nombre.toLowerCase().includes(q) ||
      (e.descripcion||"").toLowerCase().includes(q) ||
      (e.servicios||[]).join(" ").toLowerCase().includes(q) ||
      catInfo(e.categoria).nombre.toLowerCase().includes(q);
    const matchCat = !cat || e.categoria === cat;
    return matchQ && matchCat;
  });

  if (orden === "calificacion") lista.sort((a,b)=>b.calificacion-a.calificacion);
  if (orden === "nombre") lista.sort((a,b)=>a.nombre.localeCompare(b.nombre));

  document.getElementById("resultCount").textContent = lista.length;
  const cont = document.getElementById("resultados");
  const vacio = document.getElementById("sinResultados");
  if (!lista.length) { cont.innerHTML=""; vacio.classList.remove("d-none"); return; }
  vacio.classList.add("d-none");
  cont.innerHTML = lista.map(e=>`<div class="col-6 col-md-4 col-lg-3">${empresaCardHtml(e)}</div>`).join("");
}

document.getElementById("filtroForm").addEventListener("submit", e=>{e.preventDefault(); buscar();});
document.getElementById("catSelect").addEventListener("change", buscar);
document.getElementById("ordenSelect").addEventListener("change", buscar);
buscar();
</script>
  <script src="js/fusion.js"></script>
</body>
</html>
