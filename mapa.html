<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0A100A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de empresas | Anuncios con Estilos</title>
  <link rel="icon" href="imagenes/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=Rye&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/fusion.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-slot"></div>

  <header class="cat-hero" style="height:180px;background-image:url('imagenes/fotos/porton-bienvenida-tame.jpg')">
    <div class="content">
      <div class="icon-badge"><i class="bi bi-map"></i></div>
      <h1>Mapa de empresas</h1>
      <p class="mb-0">Encuentra dónde está cada empresa de la región</p>
    </div>
  </header>

  <section class="container py-4">
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="bg-white p-3 rounded-16 shadow-soft mb-3">
          <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar por nombre...">
          <h6 class="mb-2">Filtrar por categoría</h6>
          <div id="filtrosCat" class="d-flex flex-column gap-2"></div>
        </div>
      </div>
      <div class="col-lg-9">
        <div class="map-container"><div id="map-full"></div></div>
      </div>
    </div>
  </section>

  <div id="footer-slot"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="api/empresas.php"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    initHeaderFooter("mapa");

    const map = L.map('map-full').setView([6.4635, -71.7330], 15);
    crearCapaMapa().addTo(map);

    const activeCats = new Set(CATEGORIAS.map(c => c.slug));
    const markerData = [];
    const empresas = DB.all();

    empresas.forEach(e => {
      const marker = L.marker([e.lat, e.lng], { icon: iconoMarcador(catInfo(e.categoria), 32) });
      marker.bindPopup(popupEmpresa(e));
      marker.addTo(map);
      markerData.push({ e, marker });
    });
    if (empresas.length) map.fitBounds(empresas.map(e => [e.lat, e.lng]), { padding: [40, 40], maxZoom: 16 });

    document.getElementById("filtrosCat").innerHTML = CATEGORIAS.map(c => `
      <label class="d-flex align-items-center gap-2 small">
        <input type="checkbox" class="form-check-input catCheck" value="${c.slug}" checked>
        <span style="width:12px;height:12px;border-radius:3px;background:${c.color};display:inline-block;"></span>
        ${c.nombre}
      </label>`).join("");

    function actualizar() {
      const q = document.getElementById("buscador").value.toLowerCase();
      markerData.forEach(({ e, marker }) => {
        const ok = activeCats.has(e.categoria) && (!q || e.nombre.toLowerCase().includes(q));
        if (ok) { if (!map.hasLayer(marker)) marker.addTo(map); }
        else { map.removeLayer(marker); }
      });
    }
    document.querySelectorAll(".catCheck").forEach(chk => chk.addEventListener("change", () => {
      if (chk.checked) activeCats.add(chk.value); else activeCats.delete(chk.value);
      actualizar();
    }));
    document.getElementById("buscador").addEventListener("input", actualizar);
  </script>
  <script src="js/fusion.js"></script>
</body>
</html>
