<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" content="#0A100A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regístrate | Anuncios con Estilos</title>
  <link rel="icon" href="imagenes/logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&family=Rye&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/fusion.css" rel="stylesheet">
</head>
<body>
  <div id="navbar-slot"></div>

  <section class="container py-5" style="max-width:520px">
    <div class="bg-white rounded-16 shadow-soft p-4">
      <div class="text-center mb-3">
        <div class="icon-badge mx-auto mb-2" style="background:var(--primary-light);color:var(--primary)"><i class="bi bi-person-plus"></i></div>
        <h1 class="h4 mb-1">Regístrate para ver más</h1>
        <p class="text-muted small mb-0">Es gratis y rápido. Así podrás ver los datos de contacto, las fotos y los servicios de cada empresa.</p>
      </div>

      <div id="aviso" class="alert d-none py-2"></div>

      <form id="formRegistro" novalidate>
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label small mb-1" for="nombres">Nombres</label>
            <input class="form-control" id="nombres" name="nombres" maxlength="100" autocomplete="given-name" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label small mb-1" for="apellidos">Apellidos</label>
            <input class="form-control" id="apellidos" name="apellidos" maxlength="100" autocomplete="family-name" required>
          </div>
          <div class="col-12">
            <label class="form-label small mb-1" for="correo">Correo electrónico</label>
            <input class="form-control" type="email" id="correo" name="correo" maxlength="150" autocomplete="email" required>
          </div>
          <div class="col-12">
            <label class="form-label small mb-1" for="telefono">Número de teléfono</label>
            <input class="form-control" type="tel" id="telefono" name="telefono" maxlength="20" autocomplete="tel" inputmode="tel" required>
          </div>
        </div>
        <!-- Trampa para bots: las personas no ven este campo -->
        <div style="position:absolute;left:-9999px" aria-hidden="true">
          <input type="text" name="sitio_web_extra" tabindex="-1" autocomplete="off">
        </div>
        <button id="btnEnviar" class="btn btn-hero w-100 mt-4" type="submit">Registrarme y continuar</button>
        <p class="text-muted small text-center mt-3 mb-0">Si ya te registraste antes, escribe el mismo correo y entrarás de nuevo.</p>
      </form>
    </div>
  </section>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="api/empresas.php"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    initHeaderFooter("");

    // Solo se permite volver a páginas internas del sitio (evita redirecciones a sitios externos)
    function destinoSeguro() {
      const n = qs("next") || "";
      return /^(empresa\.html\?id=[\w-]+|buscar\.html|categorias\.html|categoria\.html\?cat=[\w-]+|mapa\.html|index\.html)$/.test(n) ? n : "index.html";
    }

    const aviso = document.getElementById("aviso");
    function mostrar(msg, tipo) {
      aviso.className = "alert py-2 alert-" + tipo;
      aviso.textContent = msg;
    }

    if (!window.MODO_PHP) {
      mostrar("El registro funciona cuando el sitio está publicado en el hosting (con PHP y base de datos).", "warning");
    } else if (window.USUARIO_ACTUAL) {
      location.replace(destinoSeguro());
    }

    document.getElementById("formRegistro").addEventListener("submit", async ev => {
      ev.preventDefault();
      if (!window.MODO_PHP) return;
      const f = ev.target;
      const datos = Object.fromEntries(new FormData(f).entries());
      const btn = document.getElementById("btnEnviar");
      btn.disabled = true; btn.textContent = "Enviando...";
      try {
        const r = await fetch("api/registrar.php", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(datos)
        });
        const j = await r.json().catch(() => ({}));
        if (r.ok && j.ok) {
          mostrar("¡Listo! Ya puedes ver la información de las empresas.", "success");
          setTimeout(() => location.replace(destinoSeguro()), 700);
          return;
        }
        mostrar(j.error || "No se pudo completar el registro. Intenta de nuevo.", "danger");
      } catch (e) {
        mostrar("Error de conexión. Intenta de nuevo.", "danger");
      }
      btn.disabled = false; btn.textContent = "Registrarme y continuar";
    });
  </script>
  <script src="js/fusion.js"></script>
</body>
</html>
