<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categorías | Anuncios con Estilos</title>
<link rel="icon" href="imagenes/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="navbar-slot"></div>

<header class="cat-hero" style="background-image:url('imagenes/fotos/parque-central-tame.jpg')">
  <div class="content">
    <div class="icon-badge"><i class="bi bi-grid"></i></div>
    <h1>Todas las categorías</h1>
    <p class="mb-0">Encuentra fácilmente el tipo de empresa que necesitas</p>
  </div>
</header>

<section class="container py-5">
  <div class="row g-4" id="catGrid"></div>
</section>

<div id="footer-slot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
initHeaderFooter("categorias");
document.getElementById("catGrid").innerHTML = CATEGORIAS.map(c => `
  <div class="col-6 col-md-4 col-lg-3">
    <a href="categoria.html?cat=${c.slug}" class="cat-pill" style="padding:1.8rem 1rem;">
      <div class="cat-icon" style="background:${c.color};width:60px;height:60px;font-size:1.7rem;"><i class="bi ${c.icono}"></i></div>
      <span style="font-size:1rem;">${c.nombre}</span>
      <small>${DB.byCategoria(c.slug).length} empresas</small>
    </a>
  </div>`).join("");
</script>
</body>
</html>
